services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sprout_agent
      MYSQL_USER: sprout
      MYSQL_PASSWORD: sprout-local
      MYSQL_ROOT_PASSWORD: root-local
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot-local"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sprout_agent
      POSTGRES_USER: sprout
      POSTGRES_PASSWORD: sprout-local
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprout -d sprout_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z-cpuv1
    profiles: [minio]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sprout
      MINIO_ROOT_PASSWORD: sprout-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  mysql-data:
  pgvector-data:
  minio-data:
