spring:
  application:
    name: sprout-agent
  config:
    import:
      - optional:file:.env[.properties]
      - nacos:sprout-agent-zerotier.yaml?group=DEFAULT_GROUP&refreshEnabled=false
  cloud:
    inetutils:
      preferred-networks:
        - 10.244.
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:10.244.0.111:8848}
        namespace: sprout_agent
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
      discovery:
        server-addr: ${spring.cloud.nacos.config.server-addr}
        namespace: ${spring.cloud.nacos.config.namespace}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
