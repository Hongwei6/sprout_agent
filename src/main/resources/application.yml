spring:
  application:
    name: sprout-agent
  config:
    import:
      - optional:file:.env[.properties]
      - nacos:sprout-agent-zerotier.yaml?group=DEFAULT_GROUP&refreshEnabled=false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  ai:
    openai:
      image:
        base-url: ${SPRING_AI_OPENAI_IMAGE_BASE_URL:}
        api-key: ${SPRING_AI_OPENAI_IMAGE_API_KEY:}
        options:
          model: ${SPRING_AI_OPENAI_IMAGE_OPTIONS_MODEL:dall-e-3}
  cloud:
    inetutils:
      preferred-networks:
        - 10.244.
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:10.244.0.111:8848}
        namespace: sprout_agent
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
      discovery:
        server-addr: ${spring.cloud.nacos.config.server-addr}
        namespace: ${spring.cloud.nacos.config.namespace}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
sprout:
  ppt:
    image:
      public-base-url: ${SPROUT_PPT_IMAGE_PUBLIC_BASE_URL:}
