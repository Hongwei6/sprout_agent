server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sprout-agent
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://10.244.0.111:3306/sprout_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
  ai:
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${SPRING_AI_OPENAI_API_KEY:local-placeholder}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:deepseek-chat}
      embedding:
        base-url: ${SPRING_AI_OPENAI_EMBEDDING_BASE_URL:http://10.244.0.110:11434}
        api-key: ${SPRING_AI_OPENAI_EMBEDDING_API_KEY:ollama}
        options:
          model: ${SPRING_AI_OPENAI_EMBEDDING_OPTIONS_MODEL:qwen3-embedding:4b}
          dimensions: ${SPRING_AI_OPENAI_EMBEDDING_OPTIONS_DIMENSIONS:1024}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

sprout:
  pgvector:
    url: ${PGVECTOR_URL:jdbc:postgresql://10.244.0.111:5433/sprout_agent}
    username: ${PGVECTOR_USER}
    password: ${PGVECTOR_PASSWORD}
    dimensions: ${PGVECTOR_DIMENSIONS:1024}
    initialize-schema: true
  minio:
    endpoint: ${MINIO_ENDPOINT:http://10.244.0.102:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:sprout-files}
  vision:
    base-url: ${SPROUT_VISION_BASE_URL:http://10.244.0.110:11434}
    model: ${SPROUT_VISION_MODEL:qwen3-vl:8b}
