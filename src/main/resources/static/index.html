<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="description" content="萌芽 — 一个轻盈、友好的 AI 助手。" />
    <title>萌芽 · AI 助手</title>
    <link rel="icon" type="image/png" href="sprout-logo-transparent.png" />
    <link rel="stylesheet" href="styles.css?v=ppt-progress" />
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js" defer></script>
    <script src="app.js?v=ppt-progress" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="会话导航">
        <a class="brand" href="#" aria-label="萌芽首页">
          <img class="brand-mark" src="sprout-logo-transparent.png" alt="" />
          <span class="brand-name">萌芽</span>
        </a>
        <button class="new-chat" id="new-chat" type="button"><span aria-hidden="true">＋</span> 开启新对话</button>
        <div class="sidebar-label">最近</div>
        <nav class="conversation-list" id="conversation-list" aria-label="最近对话"></nav>
        <button class="history-open" id="history-open" type="button">历史对话与归档</button>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="mobile-brand" id="mobile-new-chat" type="button" aria-label="开启新对话"><img class="brand-mark" src="sprout-logo-transparent.png" alt="" /><span>萌芽</span></button>
          <div class="model-label"><span class="status-dot"></span> 萌芽助手 <span class="model-tag">预览版</span></div>
          <button class="icon-button mobile-history" id="mobile-history" type="button" aria-label="历史对话" title="历史对话">◷</button>
          <button class="icon-button" id="clear-chat" type="button" aria-label="清空当前对话" title="清空当前对话">⌫</button>
        </header>

        <section class="chat-area" id="chat-area" aria-live="polite">
          <div class="welcome" id="welcome">
            <img class="welcome-sprout" src="sprout-logo-transparent.png" alt="" />
            <p class="eyebrow">你好，我是萌芽</p>
            <h1>有什么新点子，<span>一起发芽吧。</span></h1>
            <p class="welcome-copy">可以问我问题、整理灵感，或从一个小想法开始。</p>
            <div class="suggestions" aria-label="试试这样提问">
              <button class="suggestion" type="button" data-prompt="帮我规划一个轻松的周末">☀️ <span>帮我规划一个轻松的周末</span><b>↗</b></button>
              <button class="suggestion" type="button" data-prompt="把这个想法整理成清晰的计划">🌱 <span>把想法整理成清晰的计划</span><b>↗</b></button>
              <button class="suggestion" type="button" data-prompt="给我推荐几本值得读的书">📚 <span>推荐几本值得读的书</span><b>↗</b></button>
              <button class="suggestion" type="button" data-prompt="解释一个我一直没弄懂的概念">✨ <span>解释一个没弄懂的概念</span><b>↗</b></button>
            </div>
          </div>
          <div class="messages" id="messages"></div>
        </section>

        <footer class="composer-wrap">
          <div class="ppt-download" id="ppt-download" hidden>
            <span>PPT 文件已生成</span>
            <a id="ppt-download-link" href="#">下载 PPT 文件 ↓</a>
          </div>
          <nav class="assistant-tabs" aria-label="助手类型">
            <button class="assistant-tab active" id="dialogue-tab" type="button" aria-current="page">对话助手</button>
            <button class="assistant-tab" id="file-tab" type="button">文件助手</button>
            <button class="assistant-tab" id="ppt-tab" type="button" title="生成并下载 PPT 文件">PPT生成</button>
            <button class="assistant-tab" type="button" disabled title="深度研究暂未开放">深度研究</button>
          </nav>
          <div class="file-controls" id="file-controls" hidden>
            <label class="file-picker" for="file-input">选择文件</label>
            <input id="file-input" class="sr-only" type="file" accept=".pdf,.docx,.txt,.md,.png,.jpg,.jpeg,.webp,.gif" aria-label="上传文件" />
            <span class="file-status" id="file-status" role="status" aria-live="polite">选择文件后即可向文件助手提问。</span>
          </div>
          <form class="composer" id="chat-form">
            <label class="sr-only" for="prompt">发送消息给萌芽</label>
            <textarea id="prompt" rows="1" placeholder="给萌芽发消息…" maxlength="4000"></textarea>
            <div class="composer-bottom">
              <span class="composer-hint">萌芽还在成长中，回答可能不够准确。</span>
              <button class="send-button" id="send-button" type="submit" aria-label="发送消息" disabled><span>↑</span></button>
            </div>
          </form>
          <p class="footer-note">AI 生成内容仅供参考，请自行判断。</p>
        </footer>
      </main>
    </div>
    <dialog id="history-dialog" aria-label="历史对话">
      <div class="history-header"><strong>历史对话</strong><button type="button" id="history-close" aria-label="关闭">×</button></div>
      <div class="history-filters">
        <input id="history-search" type="search" placeholder="搜索对话标题" aria-label="搜索对话标题" />
        <select id="history-filter" aria-label="对话状态"><option value="false">未归档</option><option value="true">已归档</option></select>
      </div>
      <div id="history-results" class="history-results"></div>
    </dialog>
  </body>
</html>
